{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <a href="{{ url_for('admin_dashboard') }}" class="btn-back">← Back to Dashboard</a>
    <h2>{% if movie %}Edit Movie{% else %}Add New Movie{% endif %}</h2>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" required
                   value="{{ movie.title if movie else '' }}">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description"
                      rows="4">{{ movie.description if movie else '' }}</textarea>
        </div>
        <div class="form-group">
            <label for="genre">Genre *</label>
            <input type="text" id="genre" name="genre" required
                   value="{{ movie.genre if movie else '' }}">
        </div>
        <div class="form-group">
            <label for="duration_minutes">Duration (minutes) *</label>
            <input type="number" id="duration_minutes" name="duration_minutes" required
                   value="{{ movie.duration_minutes if movie else '' }}">
        </div>
        <div class="form-group">
            <label for="poster_url">Poster URL</label>
            <input type="text" id="poster_url" name="poster_url"
                   value="{{ movie.poster_url if movie else '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">
                {% if movie %}Update Movie{% else %}Create Movie{% endif %}
            </button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
