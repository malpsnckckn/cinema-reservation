{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <a href="{{ url_for('admin_dashboard') }}" class="btn-back">← Back to Dashboard</a>
    <h2>Add Showtime for {{ movie.title }}</h2>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="hall_name">Hall Name *</label>
            <input type="text" id="hall_name" name="hall_name"
                   placeholder="e.g. Hall A, Hall 1" required>
        </div>
        <div class="form-group">
            <label for="start_time">Start Time *</label>
            <input type="datetime-local" id="start_time" name="start_time" required>
        </div>
        <div class="form-group">
            <label for="total_seats">Total Seats *</label>
            <input type="number" id="total_seats" name="total_seats"
                   value="50" min="1" max="200" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Create Showtime</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
