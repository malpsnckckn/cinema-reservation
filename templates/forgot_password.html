{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Forgot Password</h2>

    {% if not username %}
    <p style="color:#888; margin-bottom:1.5rem; font-size:0.9rem;">
        Enter your username to find your account.
    </p>
    <form method="POST">
        <input type="hidden" name="action" value="find_user">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <button type="submit" class="btn-primary">Find Account</button>
    </form>

    {% else %}
    <p style="color:#888; margin-bottom:1.5rem; font-size:0.9rem;">
        Answer your security question to reset your password.
    </p>
    <form method="POST">
        <input type="hidden" name="action" value="reset_password">
        <input type="hidden" name="username" value="{{ username }}">
        <div class="form-group">
            <label>Security Question</label>
            <p style="padding:0.7rem 1rem; background:#f5f5f5; border-radius:6px; font-size:0.95rem; color:#444;">
                {{ security_question }}
            </p>
        </div>
        <div class="form-group">
            <label for="security_answer">Your Answer</label>
            <input type="text" id="security_answer" name="security_answer" required
                   placeholder="Case insensitive">
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required
                   placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn-primary">Reset Password</button>
    </form>
    {% endif %}

    <p><a href="{{ url_for('login') }}">← Back to Login</a></p>
</div>
{% endblock %}
